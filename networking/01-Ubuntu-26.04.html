<!DOCTYPE html>
<html>
<head>
  <title>Ubuntu 26.04</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2c001e;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 2px solid #e95420;
      border-radius: 20px;
      color: #e95420;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 72px;
      margin: 24px 0 10px;
    }

    p {
      font-size: 26px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="badge">WSL BACKEND 01</div>
    <h1>Ubuntu 26.04</h1>
    <p>Port 8001</p>
  </div>
</body>
</html>
