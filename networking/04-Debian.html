<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debian</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #17070d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 2px solid #d70a53;
      border-radius: 20px;
      color: #d70a53;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 72px;
      margin: 24px 0 10px;
    }

    p {
      font-size: 26px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">WSL BACKEND 04</div>
    <h1>Debian</h1>
    <p>Port 8004</p>
  </div>
</body>
</html>
